{% extends 'base.html' %}

{% load django_bootstrap5 %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}
    <h1 class="container mt-4">{{ title }}</h1>

    <form class="container mt-4" method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_text button_type="submit" button_class="btn btn-primary" %}
    </form>
{% endblock %}
